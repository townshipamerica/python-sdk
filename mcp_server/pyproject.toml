[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "townshipamerica-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Township America — exposes PLSS conversion to AI agents (Claude, ChatGPT, Cursor, Copilot)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Township America", email = "hello@townshipamerica.com" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "plss",
    "township",
    "range",
    "section",
    "gps",
    "coordinates",
    "geocoding",
    "gis",
    "land-survey",
    "blm",
    "ai",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0",
    "townshipamerica>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://townshipamerica.com"
Documentation = "https://townshipamerica.com/api"
Repository = "https://github.com/townshipamerica/python-sdk"
Issues = "https://github.com/townshipamerica/python-sdk/issues"

[project.scripts]
townshipamerica-mcp = "townshipamerica_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["townshipamerica_mcp"]
